<!DOCTYPE html>

<body>
<div id="ep-root">
  <p style="font-family:sans-serif;color:#666;padding:20px;">Chargement de l'outil…</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  #ep-root {
    --ep-navy: #0B3D5C;
    --ep-navy-deep: #082C42;
    --ep-teal: #1C8C7A;
    --ep-blue: #1C6FA5;
    --ep-blue-dark: #0C447C;
    --ep-amber: #C97A1F;
    --ep-amber-bg: #FCF1DE;
    --ep-amber-border: #E9B872;
    --ep-violet: #6C4FB6;
    --ep-violet-bg: #F1ECFB;
    --ep-green: #1F7A4D;
    --ep-green-bg: #E9F6EF;
    --ep-red: #B23B2E;
    --ep-red-bg: #FBEAE7;
    font-family: var(--font-sans, -apple-system, sans-serif); color: var(--text-primary, #1a1a1a); max-width: 100%;
  }
  .ep-hero { background: linear-gradient(135deg, var(--ep-navy) 0%, var(--ep-navy-deep) 100%); border-radius: 12px; padding: 22px 24px; margin-bottom: 16px; color: #fff; position: relative; overflow: hidden; }
  .ep-hero::after { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(28,140,122,0.35), transparent 70%); }
  .ep-hero .ep-h1 { color: #fff; font-size: 19px; }
  .ep-hero .ep-sub { color: rgba(255,255,255,0.75); margin-bottom: 18px; }
  .ep-card { background: var(--surface-1, #fafaf9); border: 1px solid var(--border, #e5e3dc); border-left: 3px solid var(--border, #e5e3dc); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .ep-card.ep-accent-blue { border-left-color: var(--ep-blue); }
  .ep-card.ep-accent-teal { border-left-color: var(--ep-teal); }
  .ep-card.ep-accent-violet { border-left-color: var(--ep-violet); }
  .ep-card.ep-accent-green { border-left-color: var(--ep-green); }
  .ep-h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .ep-sub { font-size: 13px; color: var(--text-secondary, #6b6a64); margin: 0 0 16px; }
  .ep-drop { border: 1.5px dashed rgba(255,255,255,0.35); border-radius: 10px; padding: 32px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; background: rgba(255,255,255,0.04); }
  .ep-drop:hover, .ep-drop.drag { border-color: var(--ep-teal); background: rgba(28,140,122,0.15); }
  .ep-drop input { display: none; }
  .ep-drop-label { font-size: 14px; color: rgba(255,255,255,0.8); }
  .ep-drop-label b { color: #fff; font-weight: 600; }
  .ep-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .ep-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
  .ep-toggle input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--ep-blue); }
  .ep-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .ep-stat { background: var(--surface-2, #fff); border: 1px solid var(--border, #e5e3dc); border-top: 3px solid var(--ep-blue); border-radius: 8px; padding: 10px 14px; min-width: 110px; }
  .ep-stat.good { border-top-color: var(--ep-green); }
  .ep-stat.warn { border-top-color: var(--ep-red); }
  .ep-stat-num { font-size: 20px; font-weight: 500; }
  .ep-stat.good .ep-stat-num { color: var(--ep-green); }
  .ep-stat.warn .ep-stat-num { color: var(--ep-red); }
  table.ep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ep-table th { text-align: left; font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--border-strong, #c9c6ba); position: sticky; top: 0; background: var(--surface-1, #fafaf9); color: var(--ep-navy); }
  table.ep-table td { padding: 6px 10px; border-bottom: 1px solid var(--border, #e5e3dc); }
  table.ep-table td.empty { color: var(--text-muted, #a3a199); font-style: italic; }
  table.ep-table td[contenteditable] { cursor: text; outline: none; }
  table.ep-table td[contenteditable]:hover { background: var(--ep-green-bg); box-shadow: inset 0 0 0 1px var(--border-strong, #c9c6ba); }
  table.ep-table td[contenteditable]:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--ep-blue); }
  table.ep-table td.ep-edited { background: var(--ep-amber-bg); box-shadow: inset 0 0 0 1px var(--ep-amber-border); }
  .ep-edit-hint { font-size: 12px; color: var(--text-secondary, #6b6a64); margin: -4px 0 10px; }
  .ep-scroll { max-height: 360px; overflow: auto; border: 1px solid var(--border, #e5e3dc); border-radius: 8px; }
  .ep-btn { background: var(--ep-blue); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .ep-btn:hover { background: var(--ep-blue-dark); }
  .ep-btn.secondary { background: transparent; color: var(--ep-navy); border: 1px solid var(--border-strong, #c9c6ba); }
  .ep-btn.secondary:hover { border-color: var(--ep-blue); color: var(--ep-blue); background: #EAF3FA; }
  .ep-btn.ai { background: var(--ep-violet); }
  .ep-btn.ai:hover { background: #5A3F9E; }
  .ep-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ep-mapping-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ep-mapping-row input { border: 1px solid var(--border, #e5e3dc); border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%; box-sizing: border-box; }
  .ep-mapping-row .arrow { color: var(--text-muted, #a3a199); font-size: 12px; }
  .ep-filename { font-size: 13px; font-weight: 500; }

  .ep-select { border: 1px solid var(--border, #e5e3dc); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .ep-hidden { display: none; }
  .ep-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #EAF3DE; color: #27500A; }
</style>
<script>
(function(){
  const root = document.getElementById('ep-root');
  try {
    runApp();
  } catch (err) {
    root.innerHTML = `<div style="font-family:sans-serif;background:#FCEBEB;border:1px solid #E24B4A;border-radius:8px;padding:16px;color:#501313;">
      <b>L'outil n'a pas pu démarrer.</b><br>
      <span style="font-size:13px;">${(err && err.message) ? err.message.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) : 'Erreur inconnue'}</span><br>
      <span style="font-size:12px;color:#712b13;">Astuce : essayez d'ouvrir ce fichier dans Chrome ou Firefox plutôt que dans un aperçu intégré, et vérifiez votre connexion internet (l'outil charge deux bibliothèques externes).</span>
    </div>`;
    console.error(err);
  }

  function runApp() {
  // Détection de colonnes par MOTS-CLÉS plutôt que par liste exacte d'en-têtes : beaucoup plus
  // robuste face aux variantes qu'on ne peut pas toutes prévoir ("No matricule", "Mle Ecole",
  // "N° matricule", "Nom et contact du parent ou tuteur", etc.).
  function stripAccents(s) {
    return s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normKey(s) {
    return stripAccents(String(s || '')).toLowerCase().replace(/[\s_]+/g, ' ').trim();
  }
  // découpe un en-tête en mots normalisés, en séparant aussi lettres et chiffres collés
  // ("telephone2" -> "telephone 2") pour ne pas rater les suffixes numériques.
  function wordsOf(s) {
    const norm = stripAccents(String(s || '')).toLowerCase().replace(/([a-z])(\d)/g, '$1 $2').replace(/[^a-z0-9]+/g, ' ').trim();
    return norm ? norm.split(' ').filter(Boolean) : [];
  }
  function matchHeader(key) {
    const words = wordsOf(key);
    if (!words.length) return null;
    const has = (list) => list.some(w => words.includes(w));
    const hasNom = has(['nom', 'noms']);
    const hasPrenom = has(['prenom', 'prenoms']);
    if (has(['matricule', 'mle', 'mat'])) return 'matricule';
    if (has(['classe'])) return 'classe';
    if (hasNom && hasPrenom) return 'nomcomplet';
    // contact/téléphone AVANT le simple "nom" isolé : une colonne comme "Nom et contact du
    // parent" contient le mot "nom" mais désigne bien un numéro de téléphone, pas un 2e nom.
    if (has(['telephone', 'tel', 'contact', 'parent', 'parents', 'tuteur', 'pere', 'mere', 'numero'])) {
      return has(['mere', 'secondaire']) || words.includes('2') ? 'telephone2' : 'telephone';
    }
    if (has(['statut', 'affectation', 'affecte'])) return 'statut';
    if (hasNom) return 'nom';
    if (hasPrenom) return 'prenom';
    return null;
  }

  // Extrait des groupes de chiffres consécutifs (8 à 13 chiffres, espaces/points/tirets isolés
  // tolérés à l'intérieur) d'un texte libre — utile quand la colonne contact mélange nom du
  // parent et numéro ("PEPE 0709362362/ MEME 0505608712" -> deux numéros distincts, pas un seul
  // bloc de 20 chiffres).
  function extractDigitGroups(raw) {
    if (!raw) return [];
    // tolère aussi les tirets cadratin/demi-cadratin (— –), fréquents par coquille ou correction
    // automatique du clavier, en plus de l'espace, du point et du tiret simple.
    const matches = String(raw).match(/\d(?:[\s.\-–—]?\d){6,12}/g) || [];
    return matches.map(m => m.replace(/\D/g, ''));
  }
  function normalizeOneNumber(digits) {
    if (digits.startsWith('00')) digits = digits.slice(2); // préfixe international
    if (digits.startsWith('225')) digits = digits.slice(3); // indicatif Côte d'Ivoire
    if (digits.length === 9) digits = '0' + digits; // le 0 initial a été perdu
    if (digits.length === 10 && digits.startsWith('0')) return digits;
    if (digits.length >= 8) return digits; // best-effort, à vérifier manuellement
    return null;
  }
  function normalizePhone(...candidates) {
    // 1ère passe : cherche un numéro parfaitement valide (10 chiffres) dans n'importe quel candidat
    for (const raw of candidates) {
      for (const g of extractDigitGroups(raw)) {
        const norm = normalizeOneNumber(g);
        if (norm && norm.length === 10) return norm;
      }
    }
    // 2e passe : à défaut, accepte le meilleur résultat approximatif trouvé
    for (const raw of candidates) {
      for (const g of extractDigitGroups(raw)) {
        const norm = normalizeOneNumber(g);
        if (norm) return norm;
      }
    }
    return '';
  }

  // Comme normalizePhone, mais ressort JUSQU'À DEUX numéros distincts au lieu d'un seul : le
  // 1er candidat (colonne "telephone") est examiné en premier, puis le 2e (colonne "telephone2")
  // — chacun peut lui-même contenir plusieurs numéros collés dans un même champ de contact libre
  // ("PEPE 0709362362/ MEME 0505608712"). Les doublons exacts sont fusionnés.
  function extractTwoPhones(primaryRaw, secondaryRaw) {
    const found = [];
    [primaryRaw, secondaryRaw].forEach(raw => {
      extractDigitGroups(raw).forEach(g => {
        const norm = normalizeOneNumber(g);
        if (norm && !found.includes(norm)) found.push(norm);
      });
    });
    return { telephone: found[0] || '', telephone2: found[1] || '' };
  }

  // Nettoie un nom de fichier / de feuille pour en tirer un nom de classe présentable quand
  // aucune colonne "classe" n'existe (ex: "LISTE__CE1_26-27" -> "CE1",
  // "INFOS_PARENT_1ERE_A2_1__2025-2026-706756060" -> "1ERE A2 1").
  function cleanFilenameAsClasse(name) {
    let s = String(name || '');
    s = s.replace(/^(liste|infos?[_ -]?parent|export|classe)[_ -]*/i, '');
    s = s.replace(/[_ -]+\d{2,4}([-_]\d{2,4})*([-_]\d+)?\s*$/, '');
    s = s.replace(/[_-]+/g, ' ').trim();
    return s || String(name || '').trim();
  }

  function findHeaderRowFlat(rows) {
    // rows: array of arrays. Find the row where recognizable headers appear.
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const mapped = rows[i].map(matchHeader).filter(Boolean);
      if ((mapped.includes('nom') || mapped.includes('nomcomplet')) && (mapped.includes('classe') || mapped.includes('telephone'))) {
        return i;
      }
    }
    return -1;
  }

  // Deux conventions rencontrées dans les colonnes "nom et prénoms" fusionnées :
  // 1) tout en majuscules, ex "ABE YAMKE EUNICE JESIMIEL" -> 1er mot = nom, reste = prénom
  // 2) NOM en majuscules suivi du Prénom en casse normale, ex "KOFFI NIEN Maffouët Pierre" ->
  //    tous les mots en tête qui sont en majuscules = nom (même s'il y en a plusieurs),
  //    le reste = prénom. Cette 2e convention permet de repérer un nom de famille composé.
  // Ramène n'importe quelle valeur de statut trouvée (AFF, NAFF, Affecté, Non Affecté, vide...)
  // à exactement "Affecté" ou "Non affecté". Vide/non précisé -> "Non affecté" par défaut.
  function normalizeAffectation(raw) {
    const s = String(raw || '').trim();
    if (!s) return 'Non affecté';
    const norm = s.toUpperCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
    if (norm.includes('NAFF') || norm.includes('NON AFFECTE') || norm.includes('NON-AFFECTE')) return 'Non affecté';
    if (norm.includes('AFF')) return 'Affecté';
    return 'Non affecté';
  }

  function splitNomComplet(full) {
    const tokens = String(full || '').trim().split(/\s+/).filter(Boolean);
    if (tokens.length <= 1) return { nom: full || '', prenom: '' };
    const isAllCaps = (t) => t === t.toUpperCase() && t !== t.toLowerCase();
    const hasMixedCase = tokens.some(t => !isAllCaps(t));
    if (hasMixedCase) {
      let i = 0;
      const nomTokens = [];
      while (i < tokens.length && isAllCaps(tokens[i])) { nomTokens.push(tokens[i]); i++; }
      if (!nomTokens.length) { nomTokens.push(tokens[0]); i = 1; } // sécurité si aucun mot n'est en majuscules
      return { nom: nomTokens.join(' '), prenom: tokens.slice(i).join(' ') };
    }
    // tout le nom est en majuscules -> pas de repère de casse, on garde l'heuristique simple
    return { nom: tokens[0], prenom: tokens.slice(1).join(' ') };
  }

  function bestGuessHeaderRowIdx(rows) {
    let bestRow = 0, bestScore = -1;
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const score = (rows[i] || []).filter(c => c !== undefined && c !== null && String(c).trim() !== '').length;
      if (score > bestScore) { bestScore = score; bestRow = i; }
    }
    return bestRow;
  }

  // Détection fiable (déterministe) : cherche une ligne d'en-tête reconnaissable via les alias
  // connus, complète la classe si elle est dans une colonne finale sans en-tête.
  // Retourne null si aucune ligne d'en-tête certaine n'a pu être identifiée.
  function detectMapping(rows) {
    const headerIdx = findHeaderRowFlat(rows);
    if (headerIdx === -1) return null;
    const header = rows[headerIdx];
    const colIdx = {};
    header.forEach((h, i) => {
      const f = matchHeader(h);
      if (f && !(f in colIdx)) colIdx[f] = i;
    });
    // certains exports mettent la classe dans une DERNIÈRE colonne SANS EN-TÊTE (valeur répétée
    // sur chaque ligne) plutôt que dans une colonne "classe" nommée -> on la détecte ici, mais
    // seulement si la cellule d'en-tête est vraiment vide (sinon on risque de confondre avec une
    // colonne réelle mais non reconnue, ex: date de naissance).
    if (!('classe' in colIdx)) {
      const usedIdx = new Set(Object.values(colIdx));
      const sampleRows = rows.slice(headerIdx + 1, headerIdx + 9).filter(r => r && r.some(c => String(c || '').trim() !== ''));
      for (let ci = header.length - 1; ci >= 0; ci--) {
        if (usedIdx.has(ci)) continue;
        const headerCell = String(header[ci] || '').trim();
        if (headerCell !== '') continue; // en-tête non vide mais non reconnu -> pas une classe implicite
        const values = sampleRows.map(r => String(r[ci] || '').trim()).filter(v => v !== '');
        if (values.length >= 3 && values.every(v => v === values[0])) {
          colIdx.classe = ci;
          break;
        }
      }
    }
    return { headerIdx, colIdx };
  }

  // Suggestion "molle" (utilisée pour pré-remplir le mapping manuel / la case IA) : essaie de
  // deviner même quand detectMapping() n'est pas assez sûr pour s'appliquer automatiquement.
  function guessMapping(rows) {
    const headerIdx = bestGuessHeaderRowIdx(rows);
    const header = rows[headerIdx] || [];
    const colIdx = {};
    header.forEach((h, i) => {
      const f = matchHeader(h);
      if (f && !(f in colIdx)) colIdx[f] = i;
    });
    return { headerIdx, colIdx };
  }

  // Applique un mapping {headerIdx, colIdx} (automatique, manuel ou suggéré par l'IA) pour produire
  // les lignes unifiées {matricule,nom,prenom,classe,telephone,statut}.
  function buildRowsFromMapping(rows, mapping, sheetTitle) {
    const { headerIdx, colIdx } = mapping;
    const hasClasseCol = 'classe' in colIdx;
    const hasNomComplet = 'nomcomplet' in colIdx && !('nom' in colIdx);
    const out = [];
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.every(c => c === undefined || c === null || String(c).trim() === '')) continue;
      const get = (f) => (f in colIdx && row[colIdx[f]] !== undefined && row[colIdx[f]] !== null) ? String(row[colIdx[f]]).trim() : '';
      let nom, prenom;
      if (hasNomComplet) {
        const split = splitNomComplet(get('nomcomplet'));
        nom = split.nom; prenom = split.prenom;
      } else {
        nom = get('nom'); prenom = get('prenom');
      }
      if (!nom) continue; // skip fully blank student rows
      const phones = extractTwoPhones(get('telephone'), get('telephone2'));
      out.push({
        matricule: get('matricule'),
        nom: nom,
        prenom: prenom,
        classe: hasClasseCol ? get('classe') : cleanFilenameAsClasse(sheetTitle),
        telephone: phones.telephone,
        telephone2: phones.telephone2,
        statut: get('statut').toUpperCase(),
      });
    }
    return out;
  }

  // Chemin complet automatique : null si aucune ligne d'en-tête fiable n'a été trouvée
  // (dans ce cas, le fichier passe par le filet de sécurité manuel / IA — voir processFiles).
  function extractRows(rows, sheetTitle) {
    const mapping = detectMapping(rows);
    if (!mapping) return null;
    return buildRowsFromMapping(rows, mapping, sheetTitle);
  }

  function sheetToAOA(ws) {
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  }

  const state = {
    fileNames: [],
    rows: [],
    excludeNaff: false,
    excludeAff: false,
    excludePhoneMissing: false,
    excludePhoneHas: false,
    useDefaultPhone: false,
    defaultPhoneValue: '0101010101',
    upperCase: true,
    includeMatricule: true,
    hasMatricule: false,
    includeAffectation: true,
    hasAffectation: false,
    includeTelephone2: true,
    hasTelephone2: false,
    classMap: {},
    customName: '',
    overrides: {}, // { [rowId]: { nom?, prenom?, classe?, telephone?, matricule? } } — corrections manuelles
    pendingTables: [],
  };

  function render() {
    try {
      renderInner();
    } catch (err) {
      console.error(err);
      root.innerHTML = `<div style="font-family:sans-serif;background:#FCEBEB;border:1px solid #E24B4A;border-radius:8px;padding:16px;color:#501313;">
        <b>Erreur d'affichage.</b><br>
        <span style="font-size:13px;">${escapeHtml(err && err.message ? err.message : String(err))}</span><br>
        <span style="font-size:12px;color:#712b13;">Copiez ce message et envoyez-le pour que je corrige.</span><br>
        <button onclick="location.reload()" style="margin-top:10px;background:#185fa5;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;">Recharger l'outil</button>
      </div>`;
    }
  }

  function renderInner() {
    const scrollBoxBefore = document.getElementById('ep-scroll');
    const savedScrollTop = scrollBoxBefore ? scrollBoxBefore.scrollTop : 0;

    const distinctClasses = [...new Set(state.rows.map(r => r.classe).filter(Boolean))].sort();
    state.hasMatricule = state.rows.some(r => r.matricule);
    state.hasAffectation = state.rows.some(r => r.statut);
    state.hasTelephone2 = state.rows.some(r => r.telephone2);
    const processed = state.rows
      .filter(r => !(state.excludeNaff && normalizeAffectation(r.statut) === 'Non affecté') && !(state.excludeAff && normalizeAffectation(r.statut) === 'Affecté'))
      .filter(r => !(state.excludePhoneMissing && !r.telephone) && !(state.excludePhoneHas && r.telephone))
      .map(r => {
        const base = {
          id: r.id,
          matricule: r.matricule || '',
          nom: state.upperCase ? r.nom.toUpperCase() : r.nom,
          prenom: state.upperCase ? r.prenom.toUpperCase() : r.prenom,
          classe: state.classMap[r.classe] !== undefined ? state.classMap[r.classe] : r.classe,
          telephone: r.telephone || (state.useDefaultPhone ? state.defaultPhoneValue : r.telephone),
          telephone2: r.telephone2 || '',
          affectation: normalizeAffectation(r.statut),
        };
        const ov = state.overrides[r.id];
        return ov ? Object.assign(base, ov) : base;
      });

    const missingPhone = processed.filter(r => !r.telephone).length;
    const missingClasse = processed.filter(r => !r.classe).length;
    const naffCount = state.rows.filter(r => normalizeAffectation(r.statut) === 'Non affecté').length;
    const affCount = state.rows.filter(r => normalizeAffectation(r.statut) === 'Affecté').length;
    const validPhone = processed.filter(r => r.telephone.length === 10).length;

  const FIELD_OPTIONS = [
    { value: '', label: '— ignorer —' },
    { value: 'matricule', label: 'Matricule' },
    { value: 'nom', label: 'Nom (colonne séparée)' },
    { value: 'prenom', label: 'Prénom (colonne séparée)' },
    { value: 'nomcomplet', label: 'Nom + Prénom (une seule colonne)' },
    { value: 'classe', label: 'Classe' },
    { value: 'telephone', label: 'Téléphone (principal)' },
    { value: 'telephone2', label: 'Téléphone (secondaire)' },
    { value: 'statut', label: 'Statut (AFF/NAFF)' },
  ];
  const VALID_FIELDS = new Set(FIELD_OPTIONS.map(o => o.value).filter(Boolean));

  // Demande à Claude d'identifier la ligne d'en-tête et le rôle de chaque colonne quand la
  // détection déterministe échoue (format jamais vu). Utilisé comme pré-remplissage suggéré —
  // l'utilisateur valide toujours manuellement avant que les données soient utilisées.
  async function suggestMappingViaAI(aoa) {
    const sample = aoa.slice(0, 15).map((row, i) => `L${i}: ` + (row || []).map(c => (c === undefined || c === null || c === '') ? '·' : String(c)).join(' | ')).join('\n');
    const prompt = `Voici les 15 premières lignes d'un export d'élèves d'une école ivoirienne (colonnes séparées par " | ", cellule vide notée "·").

${sample}

Identifie :
1. L'index de la ligne d'en-tête (0-indexé). Si les données n'ont pas de ligne d'en-tête (aucun mot descriptif), renvoie -1 et considère la colonne 0 comme la ligne 0 des données.
2. Pour CHAQUE index de colonne présent dans la ligne d'en-tête (ou dans la ligne 0 s'il n'y a pas d'en-tête), le champ auquel elle correspond parmi EXACTEMENT ces valeurs : "matricule", "nom" (nom de famille seul), "prenom" (prénom(s) seul), "nomcomplet" (nom ET prénom dans la même colonne), "classe", "telephone" (numéro principal), "telephone2" (numéro secondaire), "statut" (affecté/non affecté), ou null si la colonne ne correspond à rien d'utile (sexe, date de naissance, lieu de naissance, numéro de ligne, etc.).

Si aucune colonne ne contient la classe mais qu'une valeur identique se répète sur toutes les lignes dans une colonne sans en-tête clair, c'est probablement la classe.

Réponds UNIQUEMENT avec un objet JSON strictement de cette forme, sans texte autour, sans balises markdown :
{"headerRowIndex": <entier>, "columns": {"<indexColonne>": "<champ ou null>", ...}}`;

    // Pas d'AbortController ici : dans l'aperçu claude.ai, l'appel fetch est relayé au parent
    // via postMessage, qui ne sait pas cloner un AbortSignal (erreur navigateur, pas un bug de
    // config). On simule un délai d'attente en "abandonnant" simplement l'attente si trop long,
    // sans essayer d'annuler la requête sous-jacente.
    const fetchPromise = fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('délai dépassé (30s)')), 30000));
    const response = await Promise.race([fetchPromise, timeoutPromise]);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const text = (data.content || []).map(b => b.text || '').join('').trim();
    const cleaned = text.replace(/^```json\s*|^```\s*|```$/g, '').trim();
    let parsed;
    try {
      parsed = JSON.parse(cleaned);
    } catch (e) {
      throw new Error('réponse IA illisible');
    }
    const headerIdx = Number.isInteger(parsed.headerRowIndex) && parsed.headerRowIndex >= 0 ? parsed.headerRowIndex : 0;
    const colIdx = {};
    Object.entries(parsed.columns || {}).forEach(([ciStr, field]) => {
      const ci = parseInt(ciStr, 10);
      if (!Number.isNaN(ci) && VALID_FIELDS.has(field) && !(field in colIdx)) colIdx[field] = ci;
    });
    if (Object.keys(colIdx).length === 0) throw new Error('aucune colonne identifiée');
    return { headerIdx, colIdx };
  }

  function handleFile(e) {
    if (e.target.files.length) processFiles(Array.from(e.target.files));

  // Factorise extraction + repli "à mapper" pour une liste de tables déjà découpées en
  // grilles (AOA) — utilisé par xlsx (une table par feuille), docx (une table par tableau
  // Word) et pdf (une table par page reconstruite).
  function resolveTables(tables, fileName, multiSource) {
    let rows = [];
    const pending = [];
    tables.forEach(({ title, aoa }) => {
      const extracted = extractRows(aoa, title);
      if (extracted) rows = rows.concat(extracted);
      else pending.push({ source: multiSource ? `${fileName} — ${title}` : fileName, aoa, sheetTitle: title });
    });
    return { rows, pending };
  }

  // Extrait chaque tableau d'un fichier Word (.docx) en grille de cellules (AOA).
  // Ne gère que les vrais tableaux Word — un .docx sans tableau ne produira rien.
  async function docxToTables(arrayBuffer, fileBaseName) {
    const result = await mammoth.convertToHtml({ arrayBuffer });
    const doc = new DOMParser().parseFromString(result.value, 'text/html');
    const tableEls = Array.from(doc.querySelectorAll('table'));
    return tableEls.map((tableEl, i) => {
      const aoa = Array.from(tableEl.querySelectorAll('tr')).map(tr =>
        Array.from(tr.querySelectorAll('td,th')).map(cell => cell.textContent.trim())
      );
      return { title: tableEls.length > 1 ? `tableau ${i + 1}` : fileBaseName, aoa };
    });
  }

  // Reconstruit un tableau à partir du texte positionné d'un PDF : regroupe les fragments de
  // texte par ligne (proximité verticale), puis par colonnes (positions horizontales qui se
  // répètent d'une ligne à l'autre). Fonctionne bien pour un export PDF "propre" (Excel -> PDF,
  // logiciel de gestion scolaire) ; moins bien pour une mise en page libre — dans ce cas le
  // fichier atterrit dans le mapping manuel / suggestion IA comme n'importe quel format inconnu.
  async function pdfToTables(arrayBuffer, fileBaseName) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const allItems = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      content.items.forEach(it => {
        if (!it.str || !it.str.trim()) return;
        allItems.push({ text: it.str, x: it.transform[4], y: it.transform[5], page: p });
      });
    }
    if (!allItems.length) return [{ title: fileBaseName, aoa: [] }];

    // regroupe en lignes par proximité verticale (page + y arrondi)
    const lineKey = (it) => it.page + '_' + Math.round(it.y / 4) * 4;
    const lineMap = new Map();
    allItems.forEach(it => {
      const k = lineKey(it);
      if (!lineMap.has(k)) lineMap.set(k, []);
      lineMap.get(k).push(it);
    });
    const lines = Array.from(lineMap.values()).map(items => items.sort((a, b) => a.x - b.x));
    lines.sort((a, b) => (a[0].page - b[0].page) || (b[0].y - a[0].y));

    // détermine les colonnes en regroupant les positions x observées sur toutes les lignes
    const xs = allItems.map(it => it.x).sort((a, b) => a - b);
    const bins = [];
    xs.forEach(x => {
      const last = bins[bins.length - 1];
      if (last && x - last.max < 12) { last.max = x; } else { bins.push({ min: x, max: x }); }
    });
    const colOf = (x) => {
      let best = 0, bestDist = Infinity;
      bins.forEach((b, i) => { const d = Math.abs(x - (b.min + b.max) / 2); if (d < bestDist) { bestDist = d; best = i; } });
      return best;
    };

    const aoa = lines.map(items => {
      const row = new Array(bins.length).fill('');
      items.forEach(it => {
        const ci = colOf(it.x);
        row[ci] = row[ci] ? row[ci] + ' ' + it.text : it.text;
      });
      return row;
    });
    return [{ title: fileBaseName, aoa }];
  }

  function readFileAsRows(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const fileBaseName = file.name.replace(/\.[^.]+$/, '');
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      if (ext === 'csv') {
        reader.onload = (e) => {
          const parsed = Papa.parse(e.target.result, { delimiter: '', skipEmptyLines: true });
          const rows = extractRows(parsed.data, fileBaseName);
          resolve({
            rows: rows || [],
            pending: rows ? [] : [{ source: file.name, aoa: parsed.data, sheetTitle: fileBaseName }],
          });
        };
        reader.readAsText(file, 'UTF-8');
      } else if (ext === 'docx') {
        reader.onload = async (e) => {
          try {
            const tables = await docxToTables(e.target.result, fileBaseName);
            if (!tables.length) {
              resolve({ rows: [], pending: [{ source: file.name + ' (aucun tableau trouvé)', aoa: [['Aucun tableau Word détecté dans ce document.']], sheetTitle: fileBaseName }] });
              return;
            }
            resolve(resolveTables(tables, file.name, tables.length > 1));
          } catch (err) {
            resolve({ rows: [], pending: [{ source: file.name + ' (lecture impossible)', aoa: [[String(err.message || err)]], sheetTitle: fileBaseName }] });
          }
        };
        reader.readAsArrayBuffer(file);
      } else if (ext === 'pdf') {
        reader.onload = async (e) => {
          try {
            const tables = await pdfToTables(e.target.result, fileBaseName);
            resolve(resolveTables(tables, file.name, false));
          } catch (err) {
            resolve({ rows: [], pending: [{ source: file.name + ' (lecture impossible)', aoa: [[String(err.message || err)]], sheetTitle: fileBaseName }] });
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        reader.onload = (e) => {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: false });
          const tables = wb.SheetNames.map(name => ({
            title: wb.SheetNames.length > 1 ? name : fileBaseName,
            aoa: sheetToAOA(wb.Sheets[name]),
          }));
          resolve(resolveTables(tables, file.name, wb.SheetNames.length > 1));
        };
        reader.readAsArrayBuffer(file);
      }
    });
  }

  async function processFiles(files) {
    state.fileNames = files.map(f => f.name);
    state.customName = '';
    const results = await Promise.all(files.map(readFileAsRows));
    state.rows = [].concat(...results.map(r => r.rows));
    const rawPending = [].concat(...results.map(r => r.pending));
    state.pendingTables = rawPending.map((p, i) => {
      const guess = guessMapping(p.aoa);
      return { uid: 'pt' + i, source: p.source, aoa: p.aoa, sheetTitle: p.sheetTitle, headerIdx: guess.headerIdx, colIdx: guess.colIdx, aiTried: false, aiError: '' };
    });
    state.rows.forEach((r, i) => r.id = i);
    state.classMap = {};
    state.overrides = {};
    render();
  }

  function toCsvValue(v) {
    if (v == null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildExportColumns() {
    const cols = ['nom', 'prenom', 'classe', 'telephone'];
    if (state.hasMatricule && state.includeMatricule) cols.unshift('matricule');
    if (state.hasTelephone2 && state.includeTelephone2) cols.push('telephone2');
    if (state.includeAffectation) cols.push('affectation');
    return cols;
  }

  function downloadCsv(rows) {
    const cols = buildExportColumns();
    const lines = [cols.join(',')];
    rows.forEach(r => lines.push(cols.map(c => toCsvValue(r[c])).join(',')));
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    triggerDownload(blob, outputName() + '.csv');
  }

  function downloadXlsx(rows) {
    const cols = buildExportColumns();
    const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'eleves');
    const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    triggerDownload(new Blob([out], { type: 'application/octet-stream' }), outputName() + '.xlsx');
  }

  function outputName() {
    const raw = (state.customName || (baseName() + '_FORMATE')).trim();
    return (raw.replace(/\.(csv|xlsx|xls)$/i, '') || 'export_formate').replace(/[\\/:*?"<>|]/g, '-');
  }

  function baseName() {
    if (!state.fileNames.length) return 'export';
    if (state.fileNames.length === 1) return state.fileNames[0].replace(/\.[^.]+$/, '');
    return `import_${state.fileNames.length}fichiers`;
  }

  function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  render();
  } // fin runApp
})();
</script>
</body>
